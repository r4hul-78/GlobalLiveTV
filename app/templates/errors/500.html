{% extends "base.html" %}

{% block title %}Internal Server Error - 500{% endblock %}

{% block content %}
<div class="error-container" id="error500">
    <div class="error-badge error-critical">Error 500</div>
    <h1 class="error-title">Internal Server Error</h1>
    <p class="error-description">
        An unexpected error occurred while processing your request. Our diagnostic logs have recorded this incident.
    </p>
    <div class="error-actions">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary" id="btn500Home">Back to Home</a>
    </div>
</div>
{% endblock %}
